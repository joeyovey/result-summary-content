<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="assets/fonts/HankenGrotesk-VariableFont_wght.ttf">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="assets/fonts/HankenGrotesk-VariableFont_wght.ttf">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Hanken Grotesk", serif;
    }

    /* Centering the Container */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f4fc;
      padding: 20px;
    }

    /* Main Card Container */
    .container {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    /* Left Panel - Score Section */
    .result-card {
      background: linear-gradient(to bottom, #6a5acd, #483d8b);
      text-align: center;
      color: white;
      padding: 20px;
      border-radius: 20px 20px 0 0;
    }

    .result-card .title {
      font-size: 18px;
      font-weight: bold;
      opacity: 0.8;
    }

    .result-card .score {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.2);
      margin: 15px auto;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-card .score h1 {
      font-size: 40px;
      font-weight: bold;
    }

    .result-card .score p {
      font-size: 14px;
      opacity: 0.8;
    }

    .result-card .status {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .result-card .description {
      font-size: 14px;
      margin-top: 5px;
      opacity: 0.8;
      padding: 0 20px;
    }

    /* Right Panel - Summary Section */
    .summary-card {
      padding: 20px;
    }

    .summary-card h2 {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    /* Score Items */
    .score-item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* Color-Coding for Score Sections */
    .reaction {
      background: #ffe5e5;
      color: #d9534f;
    }

    .memory {
      background: #fff9db;
      color: #f0ad4e;
    }

    .verbal {
      background: #e0f7e9;
      color: #5cb85c;
    }

    .visual {
      background: #e3e7ff;
      color: #5a67d8;
    }

    /* Continue Button */
    .continue-btn {
      width: 100%;
      background: linear-gradient(to right, #6a5acd, #483d8b);
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .continue-btn:hover {
      opacity: 0.9;
    }

    /* Responsive Design */
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        max-width: 600px;
      }
      .result-card {
        border-radius: 20px 0 0 20px;
        width: 50%;
      }
      .summary-card {
        width: 50%;
      }
    }
    .attribution { font-size: 11px; text-align: center; clear: right;}
    .attribution a { color: hsl(228, 45%, 44%); }
    
  </style>
</head>
<body>

  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Summary Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel - Score Display -->
        <div class="result-card">
            <p class="title">Your Result</p>
            <div class="score">
                <h1>76</h1>
                <p>of 100</p>
            </div>
            <p class="status">Great</p>
            <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
        </div>

        <!-- Right Panel - Summary -->
        <div class="summary-card">
            <h2>Summary</h2>
            <div class="score-item reaction">
                <img src="assets/images/icon-reaction.svg" alt="">
                <p> Reaction</p>
                <span>80 / 100</span>
            </div>
            <div class="score-item memory">
                <img src="assets/images/icon-memory.svg" alt="">
                <p>Memory</p>
                <span>92 / 100</span>
            </div>
            <div class="score-item verbal">
                <img src="assets/images/icon-verbal.svg" alt="">
                <p>Verbal</p>
                <span>61 / 100</span>
            </div>
            <div class="score-item visual">
                <img src="assets/images/icon-visual.svg" alt="">
                <p>Visual</p>
                <span>73 / 100</span>
            </div>
            <button class="continue-btn">Continue</button>
        </div>
      </div>
      
      
      <!-- Footer -->
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="https://github.com/joeyovey">Joeovey</a>.
      </div>
  
</body>
</html>
